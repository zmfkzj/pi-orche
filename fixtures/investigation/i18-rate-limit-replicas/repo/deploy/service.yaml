apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: gateway
          image: registry.local/gateway:1.8.2
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  type: LoadBalancer
  sessionAffinity: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gateway }
spec:
  scaleTargetRef: { kind: Deployment, name: gateway }
  minReplicas: 4
  maxReplicas: 8
